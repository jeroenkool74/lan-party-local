server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Runtime-instellingen voor de website. CHAT_ENABLED komt uit de environment
  # van de container (docker-compose), zodat je de chat aan/uit kunt zetten
  # zonder de website opnieuw te bouwen.
  location = /site-config.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"chatEnabled":"${CHAT_ENABLED}"}';
  }

  location = /downloads {
    return 301 /downloads/;
  }

  location /downloads/ {
    alias /usr/share/nginx/html/downloads/;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
  }

  location / {
    try_files $uri /index.html;
  }
}
