# ngIRCd-configuratie voor de LAN-party chat.
# Wordt in de container gemount als /config/ngircd.conf (zie docker-compose).
# Volledige documentatie: https://ngircd.barton.de/doc/sample-ngircd.conf

[Global]
	Name = irc.lan
	Info = GAME LAN PARTY chat
	Network = LAN-Party
	MotdFile = /config/ngircd.motd
	PidFile = /var/run/ngircd/ngircd.pid
	Ports = 6667
	ServerUID = abc
	ServerGID = abc

[Limits]
	# Alle webchat-gebruikers komen via de websocket-bridge binnen en delen
	# dus hetzelfde IP-adres: daarom geen limiet per IP.
	MaxConnectionsIP = 0
	MaxConnections = 0
	MaxJoins = 50
	MaxNickLength = 20
	PingTimeout = 120
	PongTimeout = 20

[Options]
	# Geen DNS/ident-lookups: op het LAN maakt het verbinden alleen trager.
	DNS = no
	Ident = no
	PAM = no
	OperCanUseMode = yes

# Vaste kanalen die altijd bestaan, ook als er niemand in zit.
[Channel]
	Name = #lan
	Topic = Algemene chat voor de LAN-party. Gezellig kletsen, teams zoeken en uitdagingen!
	Modes = tn

[Channel]
	Name = #hulp
	Topic = Vragen over installeren of spelen van de games? Stel ze hier!
	Modes = tn
